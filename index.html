*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;}

body {
  display:flex;
  align-items:center; justify-content:center;
  min-height:100vh;
  background:#2D1208;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none; -webkit-user-select:none;
  overflow:hidden;
  transition:background .5s ease;
}
body.rust     { background:#7B3018; }
body.sandy    { background:#C06030; }
body.crimson  { background:#1E0606; }

/* ── BLOBS ── */
.blobs {
  position:fixed; inset:0; z-index:0;
  pointer-events:none; overflow:hidden;
  filter:blur(80px);
}
.blob { position:absolute; border-radius:50%; will-change:transform; transition:opacity .5s ease; }

/* Dark terracotta blobs */
.b1 {
  width:70vmax; height:70vmax; opacity:.55;
  background:radial-gradient(circle,#C84B2F 0%,transparent 65%);
  top:-30%; left:-20%;
  animation:d1 18s ease-in-out infinite alternate;
}
.b2 {
  width:60vmax; height:60vmax; opacity:.50;
  background:radial-gradient(circle,#D4722A 0%,transparent 65%);
  bottom:-25%; right:-15%;
  animation:d2 22s ease-in-out infinite alternate;
}
.b3 {
  width:50vmax; height:50vmax; opacity:.40;
  background:radial-gradient(circle,#A83828 0%,transparent 65%);
  top:30%; left:40%;
  animation:d3 14s ease-in-out infinite alternate;
}
.b4 {
  width:40vmax; height:40vmax; opacity:.30;
  background:radial-gradient(circle,#C06020 0%,transparent 65%);
  top:5%; right:10%;
  animation:d4 20s ease-in-out infinite alternate;
}

/* Crimson blobs — card's own palette: #F05848 coral, deep crimson, hot red */
.bc1 {
  width:68vmax; height:68vmax; opacity:0;
  background:radial-gradient(circle,#F05848 0%,transparent 65%);
  top:-28%; left:-18%;
  animation:d1 18s ease-in-out infinite alternate;
}
.bc2 {
  width:58vmax; height:58vmax; opacity:0;
  background:radial-gradient(circle,#C01818 0%,transparent 65%);
  bottom:-22%; right:-12%;
  animation:d2 22s ease-in-out infinite alternate;
}
.bc3 {
  width:48vmax; height:48vmax; opacity:0;
  background:radial-gradient(circle,#E03030 0%,transparent 65%);
  top:28%; left:38%;
  animation:d3 14s ease-in-out infinite alternate;
}

/* Warm Rust blobs */
.br1 {
  width:70vmax; height:70vmax; opacity:0;
  background:radial-gradient(circle,#D06030 0%,transparent 65%);
  top:-30%; left:-20%;
  animation:d1 18s ease-in-out infinite alternate;
  transition:opacity .5s;
}
.br2 {
  width:60vmax; height:60vmax; opacity:0;
  background:radial-gradient(circle,#A84020 0%,transparent 65%);
  bottom:-25%; right:-15%;
  animation:d2 22s ease-in-out infinite alternate;
  transition:opacity .5s;
}
.br3 {
  width:50vmax; height:50vmax; opacity:0;
  background:radial-gradient(circle,#C07040 0%,transparent 65%);
  top:30%; left:40%;
  animation:d3 14s ease-in-out infinite alternate;
  transition:opacity .5s;
}
/* Sandy Copper blobs */
.bs1 {
  width:70vmax; height:70vmax; opacity:0;
  background:radial-gradient(circle,#E09060 0%,transparent 65%);
  top:-30%; left:-20%;
  animation:d1 18s ease-in-out infinite alternate;
  transition:opacity .5s;
}
.bs2 {
  width:60vmax; height:60vmax; opacity:0;
  background:radial-gradient(circle,#C87040 0%,transparent 65%);
  bottom:-25%; right:-15%;
  animation:d2 22s ease-in-out infinite alternate;
  transition:opacity .5s;
}
.bs3 {
  width:50vmax; height:50vmax; opacity:0;
  background:radial-gradient(circle,#D08050 0%,transparent 65%);
  top:30%; left:40%;
  animation:d3 14s ease-in-out infinite alternate;
  transition:opacity .5s;
}
body.rust   .b1, body.rust   .b2, body.rust   .b3, body.rust   .b4{ opacity:0; }
body.rust   .br1{ opacity:.55; }
body.rust   .br2{ opacity:.50; }
body.rust   .br3{ opacity:.45; }
body.sandy  .b1, body.sandy  .b2, body.sandy  .b3, body.sandy  .b4{ opacity:0; }
body.sandy  .bs1{ opacity:.55; }
body.sandy  .bs2{ opacity:.50; }
body.sandy  .bs3{ opacity:.45; }

/* Crimson theme */
body.crimson .b1, body.crimson .b2, body.crimson .b3, body.crimson .b4{ opacity:0; }
body.crimson .br1, body.crimson .br2, body.crimson .br3{ opacity:0; }
body.crimson .bs1, body.crimson .bs2, body.crimson .bs3{ opacity:0; }
body.crimson .bc1{ opacity:.60; }
body.crimson .bc2{ opacity:.45; }
body.crimson .bc3{ opacity:.38; }

@keyframes d1{to{transform:translate(12vw,10vh) scale(1.18)}}
@keyframes d2{to{transform:translate(-10vw,-12vh) scale(1.22)}}
@keyframes d3{to{transform:translate(-8vw,10vh) scale(0.85)}}
@keyframes d4{to{transform:translate(-6vw,14vh) scale(1.12)}}

/* ── SCENE ── */
.scene {
  position:relative; z-index:1;
  width:min(640px,calc(100vw - 40px));
  aspect-ratio:252.311/144;
  perspective:1400px;
  cursor:pointer;
}

/* ── FLIPPER ── */
.flipper {
  width:100%; height:100%;
  transform-style:preserve-3d;
  transition:transform .72s cubic-bezier(.42,0,.18,1);
  will-change:transform;
}
.flipper.flipped{transform:rotateY(180deg)}

/* ── FACES ── */
.face {
  position:absolute; inset:0;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:14px; overflow:hidden;
  box-shadow:
    0 2px 8px rgba(10,2,0,.65),
    0 18px 50px rgba(10,2,0,.70),
    0 50px 110px rgba(0,0,0,.65);
}
.face-back{transform:rotateY(180deg)}

/* ── INNER: fixed 700×400 coordinate space ── */
.inner {
  position:absolute; top:0; left:0;
  width:700px; height:400px;
  transform-origin:top left;
  overflow:visible;
}

<script>
function scaleInner() {
  const w = document.getElementById('scene').offsetWidth;
  const s = w / 700;
  document.querySelectorAll('.inner').forEach(el => {
    el.style.transform = 'scale(' + s + ')';
  });
}
scaleInner();
window.addEventListener('resize', scaleInner);

new QRCode(document.getElementById('qr-box'), {
  text: 'https://diyaoswal1017.wixsite.com/mysite',
  width: 256, height: 256,
  colorDark: '#EAE2D0', colorLight: '#EE4623',
  correctLevel: QRCode.CorrectLevel.H
});

let flipped = false;
function flip() {
  flipped = !flipped;
  document.getElementById('flipper').classList.toggle('flipped', flipped);
  document.getElementById('hint').classList.add('gone');
}
function ev(e) { e.stopPropagation(); }

function setTheme(t) {
  const body = document.getElementById('body');
  body.classList.remove('rust','sandy','crimson');
  ['sw-t','sw-r','sw-s','sw-c'].forEach(id => document.getElementById(id).classList.remove('active'));
  if      (t === 'rust')    { body.classList.add('rust');    document.getElementById('sw-r').classList.add('active'); }
  else if (t === 'sandy')   { body.classList.add('sandy');   document.getElementById('sw-s').classList.add('active'); }
  else if (t === 'crimson') { body.classList.add('crimson'); document.getElementById('sw-c').classList.add('active'); }
  else                      { document.getElementById('sw-t').classList.add('active'); }
}

function saveContact() {
  const v = [
    'BEGIN:VCARD','VERSION:3.0',
    'FN:Diya Oswal','N:Oswal;Diya;;;',
    'TITLE:Creative Director & Designer',
    'TEL;TYPE=CELL:+917990658644',
    'EMAIL:diyaoswal.1017@gmail.com',
    'URL:https://diyaoswal1017.wixsite.com/mysite',
    'X-SOCIALPROFILE;type=instagram:https://instagram.com/oswaldiyaa',
    'NOTE:Creative Direction · Visual Identity · Illustration · Brand Strategy · Typography',
    'END:VCARD'
  ].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([v], {type:'text/vcard'}));
  a.download = 'diya-oswal.vcf';
  a.click();
}
</script>
